name: Refresh price dashboard

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours - the closest practical thing to "live" for a scraper
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - "site/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Scrape live prices
        run: node scraper/scrape.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "chore: refresh price data [skip ci]"
          git push

      - name: Build site bundle
        run: |
          mkdir -p dist
          cp -r site/. dist/
          mkdir -p dist/data
          cp data/latest.json dist/data/latest.json
          cp data/history.csv dist/data/history.csv

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
